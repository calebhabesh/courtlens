name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend-and-warehouse:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: courtlens
          POSTGRES_USER: courtlens
          POSTGRES_PASSWORD: courtlens
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U courtlens -d courtlens"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      COURTLENS_ENVIRONMENT: test
      COURTLENS_DATABASE_URL: postgresql+psycopg://courtlens:courtlens@localhost:5432/courtlens
      COURTLENS_TEST_POSTGRES_URL: postgresql+psycopg://courtlens:courtlens@localhost:5432/courtlens
      COURTLENS_REQUIRE_POSTGRES_TESTS: "true"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      COURTLENS_JWT_SECRET: ci-only-secret-with-more-than-thirty-two-characters
      DBT_HOST: localhost
      DBT_PORT: 5432
      DBT_USER: courtlens
      DBT_PASSWORD: courtlens
      DBT_DATABASE: courtlens
      DBT_SCHEMA: analytics
    steps:
      - uses: actions/checkout@v4
      - name: Use PostgreSQL 17 client tools
        run: |
          if ! test -x /usr/lib/postgresql/17/bin/pg_dump; then
            sudo apt-get update
            sudo apt-get install --yes postgresql-client-17
          fi
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -c requirements-lock.txt -e '.[dev,warehouse]'
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src/courtlens
      - run: python scripts/test_python.py --cov=courtlens --cov-report=term-missing
      - run: alembic upgrade head
      - run: courtlens seed-demo --reset
      - run: dbt build --project-dir warehouse --profiles-dir warehouse

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser -- --workers=2
      - run: npm run build
        env:
          NEXT_PUBLIC_COURTLENS_API_URL: http://localhost:8000

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build -d db migrate api dashboard
      - run: docker compose exec -T api courtlens seed-demo
      - name: Seed the disposable workbench fixture
        run: |
          docker compose cp tests/fixture_data.py api:/tmp/courtlens-fixture-data.py
          docker compose exec -T api python - <<'PY'
          import runpy
          from courtlens.database import SessionLocal

          fixture = runpy.run_path("/tmp/courtlens-fixture-data.py")
          with SessionLocal() as session:
              fixture["add_workbench_dataset"](session)
          PY
      - run: ./scripts/smoke.sh
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes
