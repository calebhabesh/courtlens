name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request cancels its older run. Every main commit keeps its own run,
# because Images publishes a tag for each green main commit.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What this run must test (scripts/ci_plan.sh): everything; only the docs lane, when nothing
  # but Markdown no code reads changed; or nothing, when a push to main has the exact tree its
  # pull request's CI already passed (merging an up-to-date pull request).
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      tests: ${{ steps.plan.outputs.tests }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci_plan.sh
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: tested-tree
          path: ${{ runner.temp }}/tested-tree
          retention-days: 30

  backend-checks:
    needs: plan
    if: needs.plan.outputs.tests == 'full'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: courtlens
          POSTGRES_USER: courtlens
          POSTGRES_PASSWORD: courtlens
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U courtlens -d courtlens"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      COURTLENS_ENVIRONMENT: test
      COURTLENS_DATABASE_URL: postgresql+psycopg://courtlens:courtlens@localhost:5432/courtlens
      COURTLENS_JWT_SECRET: ci-only-secret-with-more-than-thirty-two-characters
      DBT_HOST: localhost
      DBT_PORT: 5432
      DBT_USER: courtlens
      DBT_PASSWORD: courtlens
      DBT_DATABASE: courtlens
      DBT_SCHEMA: analytics
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/python-env
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src/courtlens
      - run: alembic upgrade head
      - run: courtlens seed-demo --reset
      # Archive publication supplies its dataset variables in a separate candidate build.
      - run: dbt build --project-dir warehouse --profiles-dir warehouse --exclude tag:archive

  # pytest in two shards (tests/conftest.py --shard: test files dealt by the seconds CI measured,
  # tests/ci_file_durations.json), each on four xdist workers with a database per worker.
  backend-tests:
    needs: plan
    if: needs.plan.outputs.tests == 'full'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    name: backend-tests (${{ matrix.shard }}/2)
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: courtlens
          POSTGRES_USER: courtlens
          POSTGRES_PASSWORD: courtlens
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U courtlens -d courtlens"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      COURTLENS_ENVIRONMENT: test
      COURTLENS_DATABASE_URL: postgresql+psycopg://courtlens:courtlens@localhost:5432/courtlens
      COURTLENS_TEST_POSTGRES_URL: postgresql+psycopg://courtlens:courtlens@localhost:5432/courtlens
      COURTLENS_REQUIRE_POSTGRES_TESTS: "true"
      COURTLENS_JWT_SECRET: ci-only-secret-with-more-than-thirty-two-characters
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      # Python 3.12's sys.monitoring tracer: line coverage (no branch coverage is configured)
      # at a fraction of the C tracer's cost.
      COVERAGE_CORE: sysmon
      COVERAGE_FILE: ${{ github.workspace }}/coverage-${{ matrix.shard }}.data
    steps:
      - uses: actions/checkout@v7
      - name: PostgreSQL 17 client tools and pdftotext
        run: |
          packages=(poppler-utils)
          if ! test -x /usr/lib/postgresql/17/bin/pg_dump; then
            sudo install -d /usr/share/postgresql-common/pgdg
            sudo curl --fail --silent --show-error \
              https://www.postgresql.org/media/keys/ACCC4CF8.asc \
              -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
            echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
              | sudo tee /etc/apt/sources.list.d/pgdg.list
            packages+=(postgresql-client-17)
          fi
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends "${packages[@]}"
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version
      - uses: ./.github/actions/python-env
      # Four workers (the runner's four CPUs), each on its own database cloned from the
      # migrated one (scripts/test_python.py).
      - run: python scripts/test_python.py -n 4 --shard=${{ matrix.shard }}/2 --cov=courtlens --cov-report=
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.shard }}
          path: coverage-${{ matrix.shard }}.data
          retention-days: 7

  # One coverage report for the whole suite, from both shards' data.
  coverage:
    needs: backend-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "$(grep '^coverage==' requirements-lock.txt)"
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          merge-multiple: true
      - run: coverage combine coverage-1.data coverage-2.data
      - run: coverage report --show-missing

  dashboard-checks:
    needs: plan
    if: needs.plan.outputs.tests == 'full'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_COURTLENS_API_URL: http://localhost:8000

  # Playwright in four shards, each on its own runner with its own production build and
  # mock API, at the two workers per runner the suite has always used.
  browser:
    needs: plan
    if: needs.plan.outputs.tests == 'full'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: browser (${{ matrix.shard }}/4)
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      # webpack's build cache for the suite's production build (playwright.config.ts).
      - uses: actions/cache/restore@v6
        with:
          path: dashboard/.next/cache
          key: next-webpack-${{ hashFiles('dashboard/package-lock.json') }}-${{ github.sha }}
          restore-keys: next-webpack-${{ hashFiles('dashboard/package-lock.json') }}-
      - run: npm ci --no-audit --no-fund
      # Playwright's system packages (fonts, mostly) come from Ubuntu's mirror, which has served
      # them at 100 kB/s; the .deb files are cached so a slow mirror costs nothing.
      - uses: actions/cache@v6
        with:
          path: ~/apt-archives
          key: playwright-apt-${{ runner.os }}-${{ hashFiles('dashboard/package-lock.json') }}
          restore-keys: playwright-apt-${{ runner.os }}-
      - name: Playwright's Chromium and its system packages
        run: |
          if compgen -G "$HOME/apt-archives/*.deb" >/dev/null; then
            sudo cp "$HOME"/apt-archives/*.deb /var/cache/apt/archives/
          fi
          npx playwright install --with-deps chromium
          mkdir -p ~/apt-archives
          cp /var/cache/apt/archives/*.deb ~/apt-archives/ 2>/dev/null || true
          echo "Cached system packages: $(compgen -G "$HOME/apt-archives/*.deb" | wc -l)"
      - run: npm run test:browser -- --workers=2 --shard=${{ matrix.shard }}/4
      - if: matrix.shard == 1 && !cancelled()
        uses: actions/cache/save@v6
        with:
          path: dashboard/.next/cache
          key: next-webpack-${{ hashFiles('dashboard/package-lock.json') }}-${{ github.sha }}

  containers:
    needs: plan
    if: needs.plan.outputs.tests == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config --quiet
      - run: docker compose up --build -d db migrate api dashboard
      - run: docker compose exec -T api courtlens seed-demo
      - name: Seed the disposable workbench fixture
        run: |
          docker compose cp tests/fixture_data.py api:/tmp/courtlens-fixture-data.py
          docker compose exec -T api python - <<'PY'
          import runpy
          from courtlens.database import SessionLocal

          fixture = runpy.run_path("/tmp/courtlens-fixture-data.py")
          with SessionLocal() as session:
              fixture["add_workbench_dataset"](session)
          PY
      - run: ./scripts/smoke.sh
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes

  # Markdown-only changes: the tests that read Markdown outside docs/design and docs/evidence.
  # tests/unit/test_frozen_identifiers.py scans every tracked file (AGENTS.md and the plans
  # included) and Vitest checks the README's quoted results (dashboard/lib/research-facts.test.ts).
  docs-lane:
    needs: plan
    if: needs.plan.outputs.tests == 'docs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/python-env
      - run: python scripts/test_python.py tests/unit/test_frozen_identifiers.py
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: dashboard
      - run: npm test
        working-directory: dashboard
