name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend-and-warehouse:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: courtlens
          POSTGRES_USER: courtlens
          POSTGRES_PASSWORD: courtlens
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U courtlens -d courtlens"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      COURTLENS_ENVIRONMENT: test
      COURTLENS_DATABASE_URL: postgresql+psycopg://courtlens:courtlens@localhost:5432/courtlens
      COURTLENS_TEST_POSTGRES_URL: postgresql+psycopg://courtlens:courtlens@localhost:5432/courtlens
      COURTLENS_REQUIRE_POSTGRES_TESTS: "true"
      COURTLENS_JWT_SECRET: ci-only-secret-with-more-than-thirty-two-characters
      DBT_HOST: localhost
      DBT_PORT: 5432
      DBT_USER: courtlens
      DBT_PASSWORD: courtlens
      DBT_DATABASE: courtlens
      DBT_SCHEMA: analytics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev,warehouse]'
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src/courtlens
      - run: pytest --cov=courtlens --cov-report=term-missing
      - run: alembic upgrade head
      - run: courtlens seed-demo --reset
      - run: dbt build --project-dir warehouse --profiles-dir warehouse

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run build
        env:
          NEXT_PUBLIC_COURTLENS_API_URL: http://localhost:8000

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build -d db migrate api dashboard
      - run: docker compose exec -T api courtlens seed-demo
      - run: ./scripts/smoke.sh
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes
