name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend-and-warehouse:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: courtload
          POSTGRES_USER: courtload
          POSTGRES_PASSWORD: courtload
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U courtload -d courtload"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      COURTLOAD_ENVIRONMENT: test
      COURTLOAD_DATABASE_URL: postgresql+psycopg://courtload:courtload@localhost:5432/courtload
      COURTLOAD_JWT_SECRET: ci-only-secret-with-more-than-thirty-two-characters
      DBT_HOST: localhost
      DBT_PORT: 5432
      DBT_USER: courtload
      DBT_PASSWORD: courtload
      DBT_DATABASE: courtload
      DBT_SCHEMA: analytics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev,warehouse]'
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src/courtload
      - run: pytest --cov=courtload --cov-report=term-missing
      - run: alembic upgrade head
      - run: courtload seed-demo --reset
      - run: dbt build --project-dir warehouse --profiles-dir warehouse

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_COURTLOAD_API_URL: http://localhost:8000

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build -d db migrate api dashboard
      - run: docker compose exec -T api courtload seed-demo
      - run: ./scripts/smoke.sh
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes
