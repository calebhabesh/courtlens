name: Images

# Builds the arm64 images the hosted demo pulls (docs/deployment.md). Runs after CI
# passes on main, so every published tag is a green commit. Nothing is built on the VPS.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        include:
          - image: courtlens-api
            context: .
            build_args: ""
          - image: courtlens-dashboard
            context: dashboard
            build_args: |
              NEXT_PUBLIC_COURTLENS_API_URL=
              NEXT_PUBLIC_COURTLENS_HOSTED=true
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/arm64
          push: true
          provenance: false
          build-args: ${{ matrix.build_args }}
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:sha-${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Record digest
        run: echo "${{ matrix.image }}@${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
