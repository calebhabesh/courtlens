version: 2
updates:
  # Minor and patch updates arrive as one grouped PR; each major update gets its own PR.
  - package-ecosystem: pip
    directory: /
    schedule: {interval: weekly}
    groups:
      python-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /dashboard
    schedule: {interval: weekly}
    groups:
      dashboard-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: monthly}
