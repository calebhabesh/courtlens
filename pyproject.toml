[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "courtlens"
version = "0.1.0"
description = "Source-traceable NBA player intelligence and fantasy decision support"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Caleb Habesh" }]
dependencies = [
  "alembic>=1.15,<2",
  "argon2-cffi>=23.1,<26",
  "anthropic>=0.125,<1",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "google-genai>=2.0.0,<3",
  "httpx>=0.27,<1",
  "openai>=2.54,<3",
  "prometheus-client>=0.21,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.8,<3",
  "PyYAML>=6.0,<7",
  "PyJWT>=2.10,<3",
  "scikit-learn==1.9.1",
  "sqlalchemy>=2.0.38,<3",
  "typer>=0.15,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.13.1,<3",
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
  "types-PyYAML>=6.0,<7",
]
warehouse = ["dbt-postgres>=1.9,<2"]

[project.scripts]
courtlens = "courtlens.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/courtlens"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config -m 'not requires_published_data and not kernel_limits'"
testpaths = ["tests"]
markers = [
  "postgres: requires a disposable PostgreSQL database",
  "requires_published_data: verifies exact historical results against a restored disposable backup",
  "kernel_limits: deliberately OOM-kills capped systemd units (desktop OOM notifications); run with -m kernel_limits",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src/courtlens"]
