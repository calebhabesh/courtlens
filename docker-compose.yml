name: courtlens

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: courtlens
      POSTGRES_USER: courtlens
      POSTGRES_PASSWORD: ${COURTLENS_POSTGRES_PASSWORD:-courtlens}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - courtlens-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courtlens -d courtlens"]
      interval: 5s
      timeout: 3s
      retries: 15

  migrate:
    build: .
    environment: &api-environment
      COURTLENS_ENVIRONMENT: development
      COURTLENS_DATABASE_URL: postgresql+psycopg://courtlens:${COURTLENS_POSTGRES_PASSWORD:-courtlens}@db:5432/courtlens
      COURTLENS_JWT_SECRET: ${COURTLENS_JWT_SECRET:-local-development-secret-change-before-deploy}
      COURTLENS_OPERATOR_TOKEN: ${COURTLENS_OPERATOR_TOKEN:-local-operator-secret-change-before-deploy}
      COURTLENS_CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000","http://localhost:${COURTLENS_DASHBOARD_PORT:-3000}"]'
      COURTLENS_RAW_STORE_PATH: /app/data/raw
      COURTLENS_PROJECT_ROOT: /app
      COURTLENS_BDL_BASE_URL: https://api.balldontlie.io/v1
      COURTLENS_BDL_REQUESTS_PER_MINUTE: ${COURTLENS_BDL_REQUESTS_PER_MINUTE:-5}
      BALLDONTLIE_API_KEY: ${BALLDONTLIE_API_KEY:-}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    environment:
      <<: *api-environment
      COURTLENS_GEMINI_API_KEY: ${COURTLENS_GEMINI_API_KEY:-${GEMINI_API_KEY:-}}
      COURTLENS_GEMINI_MODEL: ${COURTLENS_GEMINI_MODEL:-${GEMINI_MODEL:-}}
      COURTLENS_ANTHROPIC_API_KEY: ${COURTLENS_ANTHROPIC_API_KEY:-${ANTHROPIC_API_KEY:-}}
      COURTLENS_OPENAI_API_KEY: ${COURTLENS_OPENAI_API_KEY:-${OPENAI_API_KEY:-}}
      COURTLENS_ASSISTANT_PROVIDER: ${COURTLENS_ASSISTANT_PROVIDER:-}
      COURTLENS_ASSISTANT_MODEL: ${COURTLENS_ASSISTANT_MODEL:-}
      COURTLENS_ASSISTANT_MAX_STEPS: ${COURTLENS_ASSISTANT_MAX_STEPS:-6}
      COURTLENS_ASSISTANT_MAX_WEB_SEARCHES: ${COURTLENS_ASSISTANT_MAX_WEB_SEARCHES:-3}
      COURTLENS_ASSISTANT_MAX_TOKENS: ${COURTLENS_ASSISTANT_MAX_TOKENS:-60000}
      COURTLENS_ASSISTANT_TURN_TIMEOUT_SECONDS: ${COURTLENS_ASSISTANT_TURN_TIMEOUT_SECONDS:-60}
      COURTLENS_ASSISTANT_PRICES_FILE: ${COURTLENS_ASSISTANT_PRICES_FILE:-config/assistant-prices.yaml}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - courtlens-raw:/app/data/raw
      - courtlens-artifacts:/app/data/artifacts
      - courtlens-cache:/app/data/cache
      - ./data/artifacts/evaluation:/app/data/artifacts/evaluation:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build: .
    environment: *api-environment
    volumes:
      - courtlens-raw:/app/data/raw
      - courtlens-artifacts:/app/data/artifacts
      - courtlens-cache:/app/data/cache
      - ./data/artifacts/evaluation:/app/data/artifacts/evaluation:ro
    command: ["courtlens", "worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  dashboard:
    build:
      context: dashboard
      args:
        NEXT_PUBLIC_COURTLENS_API_URL: http://localhost:8000
    environment:
      COURTLENS_API_INTERNAL_URL: http://api:8000
      NEXT_PUBLIC_COURTLENS_API_URL: http://localhost:8000
      NEXT_PUBLIC_DEMO_MODE: "true"
      COURTLENS_OPERATOR_TOKEN: ${COURTLENS_OPERATOR_TOKEN:-local-operator-secret-change-before-deploy}
    ports:
      - "127.0.0.1:${COURTLENS_DASHBOARD_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

  dbt:
    build:
      context: .
      dockerfile: Dockerfile.dbt
    working_dir: /usr/app
    volumes:
      - ./warehouse:/usr/app
    environment:
      DBT_HOST: db
      DBT_PORT: 5432
      DBT_USER: courtlens
      DBT_PASSWORD: ${COURTLENS_POSTGRES_PASSWORD:-courtlens}
      DBT_DATABASE: courtlens
      DBT_SCHEMA: analytics
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: ["tools"]
    entrypoint: ["dbt"]
    command: ["build", "--profiles-dir", "."]

volumes:
  courtlens-postgres:
  courtlens-raw:
  courtlens-artifacts:
  courtlens-cache:

# Retained pre-RN02 database volume: courtload_courtload-postgres (verified locally).
