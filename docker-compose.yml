name: courtload

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: courtload
      POSTGRES_USER: courtload
      POSTGRES_PASSWORD: courtload
    ports:
      - "5432:5432"
    volumes:
      - courtload-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courtload -d courtload"]
      interval: 5s
      timeout: 3s
      retries: 15

  migrate:
    build: .
    environment: &api-environment
      COURTLOAD_ENVIRONMENT: development
      COURTLOAD_DATABASE_URL: postgresql+psycopg://courtload:courtload@db:5432/courtload
      COURTLOAD_JWT_SECRET: ${COURTLOAD_JWT_SECRET:-local-development-secret-change-before-deploy}
      COURTLOAD_CORS_ORIGINS: '["http://localhost:3000","http://localhost:${COURTLOAD_DASHBOARD_PORT:-3000}"]'
      COURTLOAD_RAW_STORE_PATH: /app/data/raw
      COURTLOAD_BDL_BASE_URL: https://api.balldontlie.io/v1
      COURTLOAD_BDL_REQUESTS_PER_MINUTE: ${COURTLOAD_BDL_REQUESTS_PER_MINUTE:-5}
      BALLDONTLIE_API_KEY: ${BALLDONTLIE_API_KEY:-}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    environment: *api-environment
    ports:
      - "8000:8000"
    volumes:
      - courtload-raw:/app/data/raw
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  dashboard:
    build:
      context: dashboard
      args:
        NEXT_PUBLIC_COURTLOAD_API_URL: http://localhost:8000
    environment:
      COURTLOAD_API_INTERNAL_URL: http://api:8000
      NEXT_PUBLIC_COURTLOAD_API_URL: http://localhost:8000
      NEXT_PUBLIC_DEMO_MODE: "true"
    ports:
      - "${COURTLOAD_DASHBOARD_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

  dbt:
    build:
      context: .
      dockerfile: Dockerfile.dbt
    working_dir: /usr/app
    volumes:
      - ./warehouse:/usr/app
    environment:
      DBT_HOST: db
      DBT_PORT: 5432
      DBT_USER: courtload
      DBT_PASSWORD: courtload
      DBT_DATABASE: courtload
      DBT_SCHEMA: analytics
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: ["tools"]
    entrypoint: ["dbt"]
    command: ["build", "--profiles-dir", "."]

volumes:
  courtload-postgres:
  courtload-raw:
