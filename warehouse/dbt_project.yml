name: courtlens_warehouse
version: 1.0.0
config-version: 2

profile: courtlens

model-paths: ["models"]
test-paths: ["tests"]
target-path: target
clean-targets: ["target", "dbt_packages"]

vars:
  reporting_timezone: "America/Toronto"

models:
  courtlens_warehouse:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
