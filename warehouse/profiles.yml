courtlens:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DBT_HOST', 'localhost') }}"
      port: "{{ env_var('DBT_PORT', '5432') | int }}"
      user: "{{ env_var('DBT_USER', 'courtlens') }}"
      password: "{{ env_var('DBT_PASSWORD', 'courtlens') }}"
      dbname: "{{ env_var('DBT_DATABASE', 'courtlens') }}"
      schema: "{{ env_var('DBT_SCHEMA', 'analytics') }}"
      threads: 4
      connect_timeout: 10
