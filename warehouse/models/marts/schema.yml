version: 2

models:
  - name: mart_player_point_in_time_features
    description: >-
      Pregame rolling features. Window frames end at one preceding row, so a game's own
      box score cannot contribute to its feature vector.
    columns:
      - name: source_stat_id
        data_tests: [unique, not_null]
      - name: calculated_as_of
        data_tests: [not_null]
  - name: mart_player_recent_form
    description: Descriptive last-ten form as of warehouse build time.
    columns:
      - name: player_key
        data_tests: [unique, not_null]
  - name: mart_team_week_schedule
    description: Team/week schedule counts, light-day games, and back-to-backs.
    columns:
      - name: team_key
        data_tests: [not_null]
      - name: week_start
        data_tests: [not_null]
  - name: mart_data_status
    description: Latest successful source run and warehouse coverage.
    columns:
      - name: data_snapshot_id
        data_tests: [unique, not_null]
  - name: mart_archive_player_profile
    description: Prior-day player windows and reconstructed next-team-game targets.
    columns:
      - name: replay_date
        data_tests: [not_null]
      - name: max_history_date
        data_tests: [not_null]
  - name: mart_archive_opponent_context
    description: Prior-game opponent production allowed, with minimum coverage in payload values.
  - name: mart_workbench_player_season_stats
    description: Aggregated season-level player research facts independent of next-game target.
    columns:
      - name: dataset_id
        data_tests: [not_null]
      - name: season
        data_tests: [not_null]
      - name: phase
        data_tests: [not_null]
      - name: player_id
        data_tests: [not_null]
      - name: team_id
        data_tests: [not_null]
  - name: mart_workbench_team_season_stats
    description: Aggregated season-level team research facts with record, production, and allowance.
    columns:
      - name: dataset_id
        data_tests: [not_null]
      - name: season
        data_tests: [not_null]
      - name: phase
        data_tests: [not_null]
      - name: team_id
        data_tests: [not_null]
  - name: mart_workbench_lineup_exposure
    description: Aggregated 5-man lineup exposure facts with offensive/defensive ratings.
    columns:
      - name: dataset_id
        data_tests: [not_null]
      - name: season
        data_tests: [not_null]
      - name: phase
        data_tests: [not_null]
      - name: team_id
        data_tests: [not_null]
      - name: lineup_key
        data_tests: [not_null]
  - name: mart_workbench_player_possession_exposure
    description: Aggregated player on-court possession exposure facts and on-court net ratings.
    columns:
      - name: dataset_id
        data_tests: [not_null]
      - name: season
        data_tests: [not_null]
      - name: phase
        data_tests: [not_null]
      - name: team_id
        data_tests: [not_null]
      - name: player_id
        data_tests: [not_null]


  - name: mart_workbench_possession_factors
    description: >-
      IM03 additive six-factor outcomes per team/game with method quality and source policy.
      Candidate datasets retain the unresolved box-estimate possession gate.
    columns:
      - name: dataset_id
        data_tests: [not_null]
      - name: game_id
        data_tests: [not_null]
      - name: offense_team_id
        data_tests: [not_null]
      - name: defense_team_id
        data_tests: [not_null]
      - name: ts_attempts
        data_tests: [not_null]
      - name: orb_opportunities
        data_tests: [not_null]
      - name: quality
        data_tests:
          - accepted_values:
              arguments:
                values: [clean, patched]
  - name: mart_stats_player_play_types
    description: Synergy play types per player-team; season totals.
    config:
      tags: [stats_feed]
    columns:
      - name: row_key
        data_tests: [unique, not_null]
      - name: player_id
        data_tests: [not_null]
      - name: play_type
        data_tests: [not_null]
  - name: mart_stats_player_tracking
    description: Tracking dashboards in long form; omitted values are unknown.
    config:
      tags: [stats_feed]
    columns:
      - name: row_key
        data_tests: [unique, not_null]
      - name: player_id
        data_tests: [not_null]
      - name: measure
        data_tests: [not_null]
      - name: stat
        data_tests: [not_null]
  - name: mart_stats_player_defense
    description: Closest-defender opponent shooting by category.
    config:
      tags: [stats_feed]
    columns:
      - name: row_key
        data_tests: [unique, not_null]
      - name: player_id
        data_tests: [not_null]
      - name: category
        data_tests: [not_null]
  - name: mart_stats_player_hustle
    description: Hustle season totals per player-team.
    config:
      tags: [stats_feed]
    columns:
      - name: row_key
        data_tests: [unique, not_null]
      - name: player_id
        data_tests: [not_null]
  - name: mart_stats_season_matchups
    description: Season matchup totals by offensive/defensive player.
    config:
      tags: [stats_feed]
    columns:
      - name: row_key
        data_tests: [unique, not_null]
      - name: off_player_id
        data_tests: [not_null]
      - name: def_player_id
        data_tests: [not_null]
  - name: mart_stats_lineups
    description: Five-man lineup ratings; dataset_truncated marks the 2,000-row cap.
    config:
      tags: [stats_feed]
    columns:
      - name: row_key
        data_tests: [unique, not_null]
      - name: team_id
        data_tests: [not_null]
      - name: lineup_id
        data_tests: [not_null]
  - name: mart_stats_draft_combine
    description: Draft combine measurements; never listed roster values.
    config:
      tags: [stats_feed]
    columns:
      - name: row_key
        data_tests: [unique, not_null]
      - name: draft_year
        data_tests: [not_null]
      - name: entity_key
        data_tests: [not_null]
  - name: mart_player_roster_seasons
    description: Team-reported roster listings per season (birth date, size, jersey, experience).
    config:
      tags: [stats_feed]
    columns:
      - name: row_key
        data_tests: [unique, not_null]
      - name: player_id
        data_tests: [not_null]
  - name: mart_player_bio
    description: One biography row per NBA person from the player index and team rosters.
    config:
      tags: [stats_feed]
    columns:
      - name: player_id
        data_tests: [unique, not_null]
  - name: mart_stats_draft_history
    description: Draft history by draft year.
    config:
      tags: [stats_feed]
    columns:
      - name: row_key
        data_tests: [unique, not_null]
      - name: draft_year
        data_tests: [not_null]
  - name: mart_stats_pbpstats_player_totals
    description: pbpstats secondary possessions/plus-minus; 500-row cap.
    config:
      tags: [stats_feed]
    columns:
      - name: row_key
        data_tests: [unique, not_null]
      - name: player_id
        data_tests: [not_null]
