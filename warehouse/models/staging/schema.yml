version: 2

models:
  - name: stg_teams
    description: Cleaned one-row-per-provider-team identities.
    columns:
      - name: team_key
        data_tests: [unique, not_null]
  - name: stg_players
    description: Cleaned one-row-per-provider-player identities.
    columns:
      - name: player_key
        data_tests: [unique, not_null]
  - name: stg_games
    description: One row per provider game with an explicit UTC tipoff and reporting-local date.
    columns:
      - name: game_key
        data_tests: [unique, not_null]
      - name: scheduled_start_utc
        data_tests: [not_null]
  - name: stg_player_games
    description: One row per provider-supplied full-game player stat line.
    columns:
      - name: source_stat_id
        data_tests: [unique, not_null]
  - name: stg_archive_player_games
    description: Dataset-selected archive player/game facts with nullable counts preserved.
    columns:
      - name: dataset_id
        data_tests: [not_null]
      - name: game_id
        data_tests: [not_null]
      - name: player_id
        data_tests: [not_null]
      - name: player_name
        data_tests: [not_null]
  - name: stg_archive_team_games
    description: Dataset-selected authoritative team/game totals.
    columns:
      - name: dataset_id
        data_tests: [not_null]
      - name: game_id
        data_tests: [not_null]
      - name: team_id
        data_tests: [not_null]
  - name: stg_workbench_player_games
    description: Cleaned and typed workbench player-game facts.
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: dataset_id
        data_tests: [not_null]
      - name: game_id
        data_tests: [not_null]
      - name: player_id
        data_tests: [not_null]
  - name: stg_workbench_team_games
    description: Cleaned and typed workbench team-game facts.
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: dataset_id
        data_tests: [not_null]
      - name: game_id
        data_tests: [not_null]
      - name: team_id
        data_tests: [not_null]
  - name: stg_workbench_schedules
    description: Cleaned workbench schedule records.
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: dataset_id
        data_tests: [not_null]
      - name: game_id
        data_tests: [not_null]
  - name: stg_workbench_lineup_stints
    description: Cleaned continuous 5-on-5 lineup stint observations.
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: dataset_id
        data_tests: [not_null]
      - name: game_id
        data_tests: [not_null]
      - name: stint_index
        data_tests: [not_null]
      - name: duration_seconds
        data_tests: [not_null]
  - name: stg_workbench_possessions
    description: Cleaned workbench possession records under possession-policy-v1.
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: dataset_id
        data_tests: [not_null]
      - name: game_id
        data_tests: [not_null]
      - name: possession_number
        data_tests: [not_null]
  - name: stg_workbench_stint_players
    description: Cleaned player exposure during continuous lineup stints.
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: dataset_id
        data_tests: [not_null]
      - name: stint_id
        data_tests: [not_null]
      - name: player_id
        data_tests: [not_null]

