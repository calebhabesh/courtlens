version: 2

models:
  - name: int_team_games
    description: Two team-perspective rows per game.
    columns:
      - name: game_key
        data_tests: [not_null]
      - name: team_key
        data_tests: [not_null]
  - name: int_player_games_scored
    description: >-
      Full-game stat lines scored with CourtLens's published default fixture formula.
      Product requests recalculate using the user's versioned formula.
    columns:
      - name: source_stat_id
        data_tests: [unique, not_null]
      - name: fantasy_points_default
        data_tests: [not_null]
  - name: fct_archive_player_game
    description: Immutable dataset/player/game facts using reference-points v1.
    columns:
      - name: dataset_id
        data_tests: [not_null]
  - name: fct_archive_team_game
    description: Immutable dataset/team/game facts with two perspectives per game.
    columns:
      - name: dataset_id
        data_tests: [not_null]
  - name: fct_workbench_player_game
    description: Workbench player-game facts with legacy fantasy score.
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: dataset_id
        data_tests: [not_null]
  - name: fct_workbench_team_game
    description: Workbench team-game facts with outcome win/loss flag.
    columns:
      - name: id
        data_tests: [unique, not_null]
      - name: dataset_id
        data_tests: [not_null]
  - name: fct_workbench_lineup_stint
    description: Team-perspective continuous lineup stint facts with points and possession exposure.
    columns:
      - name: stint_id
        data_tests: [not_null]
      - name: dataset_id
        data_tests: [not_null]
      - name: game_id
        data_tests: [not_null]
      - name: team_id
        data_tests: [not_null]
      - name: side
        data_tests: [not_null]
  - name: fct_workbench_possession
    description: Possession facts with schedule attributes under possession-policy-v1.
    columns:
      - name: possession_id
        data_tests: [not_null]
      - name: dataset_id
        data_tests: [not_null]
      - name: game_id
        data_tests: [not_null]
      - name: offense_team_id
        data_tests: [not_null]

