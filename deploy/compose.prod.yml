# Hosted read-only demo at https://courtlens.calebhabesh.com (see docs/deployment.md).
# Runs on the shared Oracle VPS at /home/ubuntu/apps/courtlens. Images are pulled from
# GHCR by digest (written to release.env by scripts/deploy-vps.sh); nothing is built here.
name: courtlens

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-api-environment: &api-environment
  COURTLENS_ENVIRONMENT: production
  COURTLENS_DATABASE_URL: postgresql+psycopg://courtlens:${COURTLENS_POSTGRES_PASSWORD:?}@db:5432/courtlens
  COURTLENS_JWT_SECRET: ${COURTLENS_JWT_SECRET:?}
  COURTLENS_OPERATOR_TOKEN: ${COURTLENS_OPERATOR_TOKEN:?}
  COURTLENS_CORS_ORIGINS: '["https://courtlens.calebhabesh.com"]'
  # Public Ask: free-tier keys only (no billing on either account), a few questions per visitor
  # and one shared daily budget below Gemini's 500 free requests (docs/deployment.md).
  COURTLENS_PUBLIC_ASK: "true"
  COURTLENS_PUBLIC_ASK_TOKEN: ${COURTLENS_PUBLIC_ASK_TOKEN:?}
  # Accounts (finish plan F04): held only by the dashboard's account proxy; also salts the
  # client address for sign-in limits. Without it the API refuses every account request.
  COURTLENS_ACCOUNT_PROXY_TOKEN: ${COURTLENS_ACCOUNT_PROXY_TOKEN:?}
  COURTLENS_PUBLIC_ASK_PROMPTS_PER_VISITOR: "3"
  COURTLENS_PUBLIC_ASK_DAILY_REQUESTS: "480"
  COURTLENS_ASSISTANT_PROVIDERS: gemini,groq
  COURTLENS_GEMINI_REQUESTS_PER_DAY: "500"
  # The model measured locally (5 s answers, 500 free requests a day). The agent's built-in default
  # is gemini-3.8-flash, which timed out on the demo's first live question (2026-11-11).
  COURTLENS_GEMINI_MODEL: gemini-3.5-flash-lite
  # Finish inside the dashboard proxy's 55 s, so a slow turn returns what it has, not an error.
  COURTLENS_ASSISTANT_TURN_TIMEOUT_SECONDS: "45"
  # The free tier refuses Google Search grounding; trying costs a request and a 30 s cooldown.
  COURTLENS_ASSISTANT_MAX_WEB_SEARCHES: "0"
  COURTLENS_GEMINI_API_KEY: ${COURTLENS_GEMINI_API_KEY:?}
  COURTLENS_GROQ_API_KEY: ${COURTLENS_GROQ_API_KEY:-}
  COURTLENS_RAW_STORE_PATH: /app/data/raw
  COURTLENS_PROJECT_ROOT: /app
  COURTLENS_IMPACT_SERVING_MANIFEST: ${COURTLENS_IMPACT_SERVING_MANIFEST:?}
  COURTLENS_VALUE_ARCHETYPES_MANIFEST: ${COURTLENS_VALUE_ARCHETYPES_MANIFEST:?}
  COURTLENS_WOWY_MANIFEST: ${COURTLENS_WOWY_MANIFEST:?}
  COURTLENS_IMPACT_TEAM_SPLITS_MANIFEST: ${COURTLENS_IMPACT_TEAM_SPLITS_MANIFEST:?}

services:
  db:
    image: ${COURTLENS_POSTGRES_IMAGE:?}
    restart: unless-stopped
    mem_limit: 2g
    # Player pages fan out ~25 season queries at once; one CPU serialized them (17s pages).
    cpus: 3.0
    shm_size: 256m
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=16MB
      - -c
      - max_connections=40
    environment:
      POSTGRES_DB: courtlens
      POSTGRES_USER: courtlens
      POSTGRES_PASSWORD: ${COURTLENS_POSTGRES_PASSWORD:?}
    volumes:
      - postgres:/var/lib/postgresql/data
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courtlens -d courtlens"]
      interval: 10s
      timeout: 3s
      retries: 15

  migrate:
    image: ${COURTLENS_API_IMAGE:?}
    profiles: [migrate]
    environment: *api-environment
    command: ["alembic", "upgrade", "head"]
    mem_limit: 512m
    logging: *logging
    depends_on:
      db:
        condition: service_healthy

  # Finish plan F04: restores the demo account's shared favourites to the seeded list at 08:00 UTC
  # (about midnight Pacific). It sleeps in sh between runs and stores nothing: each run deletes
  # the demo's rows and inserts the seed again (docs/deployment.md).
  demo-reset:
    image: ${COURTLENS_API_IMAGE:?}
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.25
    environment: *api-environment
    command:
      - sh
      - -c
      - >-
        while :; do
        now=$$(date -u +%s);
        next=$$(date -u -d 'today 08:00' +%s);
        [ "$$next" -gt "$$now" ] || next=$$(date -u -d 'tomorrow 08:00' +%s);
        sleep $$((next - now));
        courtlens reset-demo-favorites || echo 'demo favourites reset failed' >&2;
        done
    logging: *logging
    depends_on:
      db:
        condition: service_healthy

  # Win Probability v4 W2: seals each scheduled game's pregame inputs and scores finished games.
  # One run at start, then at 09:00 US Eastern (last night's scores) and every 30 minutes from
  # 12:25 (at :25 and :55, so a game's last seal is 5 minutes before its tip) until the day's
  # last scheduled tip; `--next-wake` prints the seconds to sleep. It owns
  # the serving directory and ESPN's raw store (read-write, as the host's ubuntu user, which owns
  # them); everything else it reads is pushed from the owner's PC and mounted read-only. Peak
  # 338 MB measured on the PC with three nights scored in one run (docs/deployment.md).
  win-probability-seal:
    image: ${COURTLENS_API_IMAGE:?}
    restart: unless-stopped
    user: "1001:1001"
    mem_limit: 768m
    cpus: 1.0
    environment: *api-environment
    command:
      - sh
      - -c
      - >-
        while :; do
        wait=$$(courtlens seal-win-probability --next-wake | tail -n 1);
        case "$$wait" in ''|*[!0-9]*) echo 'seal run gave no wake time' >&2; wait=1800;; esac;
        sleep "$$wait";
        done
    volumes:
      - ./data/artifacts/win-probability:/app/data/artifacts/win-probability:ro
      - ./data/derived/win-probability-ratings:/app/data/derived/win-probability-ratings:ro
      - ./data/derived/espn-rosters-v1:/app/data/derived/espn-rosters-v1:ro
      - ./data/raw:/app/data/raw:ro
      - ./data/raw/espn-wp:/app/data/raw/espn-wp
      - ./data/derived/win-probability-serving:/app/data/derived/win-probability-serving
    logging: *logging

  api:
    image: ${COURTLENS_API_IMAGE:?}
    restart: unless-stopped
    # The 12-season impact bundle peaks near 2.3 GB while serving (measured 2026-11-10).
    mem_limit: 3g
    cpus: 2.0
    environment: *api-environment
    volumes:
      - ./data/artifacts/evaluation:/app/data/artifacts/evaluation:ro
      - ./data/derived/impact-serving-v1:/app/data/derived/impact-serving-v1:ro
      - ./data/derived/impact-team-splits-v1:/app/data/derived/impact-team-splits-v1:ro
      - ./data/derived/value-archetypes-v1/serving:/app/data/derived/value-archetypes-v1/serving:ro
      - ./data/derived/wowy-v1:/app/data/derived/wowy-v1:ro
      - ./data/artifacts/analyses:/app/data/artifacts/analyses:ro
      - ./data/cache/portraits:/app/data/cache/portraits:ro
      - ./data/artifacts/win-probability:/app/data/artifacts/win-probability:ro
      - ./data/derived/win-probability-serving:/app/data/derived/win-probability-serving:ro
      - ./data/artifacts/projected-impact:/app/data/artifacts/projected-impact:ro
      - ./data/derived/projected-impact-serving:/app/data/derived/projected-impact-serving:ro
      - ./data/derived/win-probability-ratings:/app/data/derived/win-probability-ratings:ro
      - ./data/derived/metric-backtest-serving:/app/data/derived/metric-backtest-serving:ro
      - ./data/derived/draft-value-v1:/app/data/derived/draft-value-v1:ro
      - ./data/derived/lineup-model-v1:/app/data/derived/lineup-model-v1:ro
      - ./data/derived/darko-dpm-v2:/app/data/derived/darko-dpm-v2:ro
      - ./data/derived/espn-rosters-v1:/app/data/derived/espn-rosters-v1:ro
      - ./data/derived/wikipedia-transactions-v1:/app/data/derived/wikipedia-transactions-v1:ro
      - ./data/derived/free-agency-v1:/app/data/derived/free-agency-v1:ro
      - ./data/derived/shot-zones-v1:/app/data/derived/shot-zones-v1:ro
      - ./data/derived/position-estimates-v1:/app/data/derived/position-estimates-v1:ro
      - ./data/derived/contracts-checks:/app/data/derived/contracts-checks:ro
      - ./data/derived/stint-box-v1:/app/data/derived/stint-box-v1:ro
      - ./data/artifacts/research-runs:/app/data/artifacts/research-runs:ro
      - ./data/artifacts/research-run-packages:/app/data/artifacts/research-run-packages:ro
      - ./data/raw:/app/data/raw:ro
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  dashboard:
    image: ${COURTLENS_DASHBOARD_IMAGE:?}
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
    # No operator token: the hosted demo cannot mutate the workspace or start jobs. The Ask
    # token lets its proxy start Ask turns and threads only, under the API's public limits. The
    # account token lets its proxy sign in and change the signed-in user's own favourites only.
    environment:
      COURTLENS_API_INTERNAL_URL: http://api:8000
      COURTLENS_PUBLIC_ASK: "true"
      COURTLENS_PUBLIC_ASK_TOKEN: ${COURTLENS_PUBLIC_ASK_TOKEN:?}
      COURTLENS_ACCOUNT_PROXY_TOKEN: ${COURTLENS_ACCOUNT_PROXY_TOKEN:?}
    logging: *logging
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  caddy:
    image: ${COURTLENS_CADDY_IMAGE:?}
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    ports:
      - "127.0.0.1:8090:8080"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
    logging: *logging
    depends_on:
      dashboard:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz | grep -qx ok"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  cloudflared:
    image: ${COURTLENS_CLOUDFLARED_IMAGE:?}
    profiles: [tunnel]
    restart: unless-stopped
    # The connector needs the host loopback, where the origin is published.
    network_mode: host
    user: "1001:1001"
    mem_limit: 128m
    cpus: 0.5
    command:
      - tunnel
      - --no-autoupdate
      - --metrics
      - 127.0.0.1:20090
      - run
      - --token-file
      - /run/secrets/tunnel-token
    volumes:
      - ./secrets:/run/secrets:ro
    depends_on:
      caddy:
        condition: service_healthy
    logging: *logging

volumes:
  postgres:
